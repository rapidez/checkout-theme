name: Playwright

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      update_all_screenshots:
        description: 'Update all screenshots?'
        type: boolean

jobs:
  playwright:
    uses: rapidez/workflows/.github/workflows/playwright.yml@master
    with:
      package: checkout-theme
      setup: |
        php artisan vendor:publish --provider="Rapidez\CheckoutTheme\ServiceProvider" --tag=core-overwrites
        php artisan vendor:publish --provider="Rapidez\Core\RapidezServiceProvider" --tag="config"
        sed -i "s/'login',//g" config/rapidez/frontend.php
      update-all-screenshots: ${{ inputs.update_all_screenshots || false }}
    secrets: inherit
